<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>仓管家</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
body { font-family:-apple-system,"Microsoft YaHei",sans-serif; background:#f4f6fa; color:#1c2333;
       font-size:15px; height:100vh; display:flex; flex-direction:column; overflow:hidden; }
.hide { display:none !important; }
input,select,textarea,button { font-family:inherit; font-size:15px; }
input,select,textarea { border:1px solid #d7dde8; border-radius:8px; padding:9px 10px; background:#fff; width:100%; }
button { border:0; border-radius:8px; padding:11px 14px; background:#1f6feb; color:#fff; font-weight:600; }
button.gray { background:#eef1f6; color:#44506a; }
button.danger { background:#e5484d; }
button.small { padding:7px 12px; font-size:13px; font-weight:500; }
button:disabled { opacity:.5; }
header { background:#1f6feb; color:#fff; padding:10px 14px; display:flex; align-items:center; gap:8px; flex:none; }
header b { font-size:16px; flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
header .badge { font-size:11px; background:rgba(255,255,255,.22); border-radius:10px; padding:3px 8px; flex:none; }
header .badge.rw { background:#2fb344; }
header button { padding:6px 10px; font-size:12px; background:rgba(255,255,255,.18); flex:none; }
nav { display:flex; background:#fff; border-bottom:1px solid #e2e7f0; flex:none; }
nav div { flex:1; text-align:center; padding:10px 0; color:#5a6478; font-size:14px; border-bottom:2px solid transparent; }
nav div.on { color:#1f6feb; border-bottom-color:#1f6feb; font-weight:700; }
main { flex:1; overflow:auto; padding:12px; }
.card { background:#fff; border:1px solid #e2e7f0; border-radius:12px; padding:14px; margin-bottom:12px; }
.card h3 { font-size:15px; margin-bottom:10px; }
.card .hint { color:#8a94a6; font-size:12px; margin-top:8px; line-height:1.6; }
.frow { display:flex; gap:10px; }
.fcol { flex:1; margin-bottom:10px; }
.fcol label { display:block; font-size:12px; color:#5a6478; margin-bottom:4px; }
/* 带「扫一扫」的标签行 */
label.lbl-io { display:flex; align-items:center; }
label.lbl-io button { margin-left:auto; padding:3px 10px; font-size:12px; line-height:1.6; }
/* 分段 */
.seg { display:flex; background:#e9edf4; border-radius:9px; padding:3px; margin-bottom:10px; }
.seg div { flex:1; text-align:center; padding:7px 0; font-size:13px; color:#5a6478; border-radius:7px; }
.seg div.on { background:#fff; color:#1f6feb; font-weight:700; }
/* 表格 */
.tblwrap { overflow:auto; background:#fff; border:1px solid #e2e7f0; border-radius:12px; }
table { border-collapse:collapse; min-width:100%; }
th { background:#eef1f6; color:#44506a; font-size:12px; font-weight:600; padding:9px 10px;
     white-space:nowrap; position:sticky; top:0; text-align:left; border-bottom:1px solid #d7dde8; }
td { padding:9px 10px; border-bottom:1px solid #eef1f6; font-size:13px; white-space:nowrap; }
tr.sold td { color:#b3b9c6; }
tr:active { background:#f0f5ff; }
.empty { text-align:center; color:#8a94a6; padding:30px 0; font-size:13px; }
.searchrow { display:flex; gap:8px; margin-bottom:10px; }
.searchrow input { flex:1; }
.searchrow button { flex:none; }
.stat { color:#8a94a6; font-size:12px; margin:6px 2px 0; }
.tag { display:inline-block; font-size:11px; border-radius:8px; padding:2px 7px; margin-left:6px; }
.tag.ok { background:#e5f6eb; color:#218a4a; }
.tag.wait { background:#fdf1e2; color:#b96e12; }
/* 弹层 */
#mask { position:fixed; inset:0; background:rgba(20,26,40,.45); z-index:20;
        display:flex; align-items:flex-end; justify-content:center; }
#sheet { background:#fff; border-radius:16px 16px 0 0; width:100%; max-height:88vh;
         overflow:auto; padding:16px 16px 26px; }
#sheet h3 { margin-bottom:12px; display:flex; align-items:center; }
#sheet h3 span { flex:1; }
#sheet .btnrow { display:flex; gap:10px; margin-top:14px; }
#sheet .btnrow button { flex:1; }
#toast { position:fixed; left:50%; bottom:90px; transform:translateX(-50%);
         background:rgba(20,26,40,.85); color:#fff; padding:9px 16px; border-radius:20px;
         font-size:13px; z-index:30; max-width:80vw; text-align:center; }
/* 列题行 / 设置行 */
.ctrow { display:flex; align-items:center; gap:10px; padding:7px 0; border-bottom:1px solid #f0f2f7; }
.ctrow .def { flex:none; width:64px; font-size:13px; color:#8a94a6; }
.ctrow input { flex:1; padding:7px 9px; }
.statline { font-size:13px; color:#44506a; line-height:1.8; margin-top:8px; }
</style>
</head>
<body>

<header>
  <b>仓管家</b>
  <span class="badge" id="hPerm">本地模式</span>
</header>

<nav>
  <div data-t="inv" class="on">库存</div>
  <div data-t="add">录入</div>
  <div data-t="sell">出售</div>
  <div data-t="rec">记录</div>
  <div data-t="set">设置</div>
</nav>

<main id="main">
  <!-- 库存 -->
  <div id="pInv">
    <div class="seg">
      <div id="segLoc" class="on">手机库存</div>
      <div id="segPc">电脑库存</div>
    </div>
    <div class="searchrow"><input id="inKw" placeholder="搜编号 / 品牌 / 型号 / 货架 / 备注">
      <button id="btnKw">搜索</button></div>
    <div class="stat" id="invStat"></div>
    <div class="tblwrap"><table id="tInv"><thead></thead><tbody></tbody></table></div>
  </div>
  <!-- 录入 -->
  <div id="pAdd" class="hide">
    <div class="card">
      <h3>新增入库（编号自动生成）</h3>
      <div class="frow">
        <div class="fcol"><label>品牌</label><input id="aBrand"></div>
        <div class="fcol"><label>品类</label><input id="aCate"></div>
      </div>
      <div class="frow">
        <div class="fcol"><label class="lbl-io">型号<button type="button" class="gray small" id="btnScanModel">扫一扫</button></label><input id="aModel"></div>
        <div class="fcol"><label>成色</label><input id="aCond"></div>
      </div>
      <div class="frow">
        <div class="fcol"><label>单价</label><input id="aPrice" inputmode="decimal"></div>
        <div class="fcol"><label>数量</label><input id="aQty" inputmode="numeric" value="1"></div>
      </div>
      <div class="fcol"><label>货架</label><input id="aShelf"></div>
      <div class="fcol"><label>备注</label><textarea id="aRemark" rows="2"></textarea></div>
      <button id="btnAdd" style="width:100%">保存到手机</button>
      <div class="hint">数据存在手机里，离线可用；开启「数据共享到电脑端」后会自动/手动同步到电脑。</div>
    </div>
  </div>
  <!-- 出售 -->
  <div id="pSell" class="hide">
    <div class="card">
      <h3>登记出售（手机库存）</h3>
      <div class="fcol"><label>商品编号</label><input id="sCode" autocapitalize="characters" placeholder="手机库存里的编号"></div>
      <div class="frow">
        <div class="fcol"><label>数量</label><input id="sQty" inputmode="numeric" value="1"></div>
        <div class="fcol"><label>单价（留空按原价）</label><input id="sPrice" inputmode="decimal"></div>
      </div>
      <div class="frow">
        <div class="fcol"><label>买家</label><input id="sBuyer"></div>
        <div class="fcol"><label>备注</label><input id="sRemark"></div>
      </div>
      <button id="btnSell" style="width:100%">登记出售</button>
      <div class="hint" id="sellMsg"></div>
    </div>
  </div>
  <!-- 记录 -->
  <div id="pRec" class="hide">
    <div class="stat" style="margin:0 2px 8px">手机上的出售记录；「待同步」的会在连接电脑后自动上传。</div>
    <div class="tblwrap"><table id="tRec"><thead></thead><tbody></tbody></table></div>
  </div>
  <!-- 设置 -->
  <div id="pSet" class="hide">
    <div class="card">
      <h3>数据共享到电脑端</h3>
      <div class="hint" style="margin:0 0 10px">手机数据照常存在手机里；开启后录入/出售会直接同步到电脑「手机数据」区（需电脑端已「开启共享」）。</div>
      <button id="btnQrConn" style="width:100%;margin:0 0 10px">扫电脑二维码，自动连接</button>
      <div class="fcol"><label>电脑地址（局域网共享 → 手机访问）</label>
        <input id="shBase" placeholder="例如 192.168.1.5:8765" autocapitalize="off"></div>
      <div class="fcol"><label>连接码</label>
        <input id="shCode" type="password" inputmode="numeric" placeholder="电脑上显示的 6 位连接码"></div>
      <div class="btnrow" style="display:flex;gap:10px">
        <button id="btnShareConn" style="flex:1">连接电脑</button>
        <button id="btnShareOff" class="gray" style="flex:1">断开</button>
      </div>
      <div class="statline" id="shareStat"></div>
      <div class="btnrow" style="display:flex;gap:10px;margin-top:6px">
        <button id="btnSync" style="flex:1">立即同步到电脑</button>
        <button id="btnAuto" class="gray" style="flex:1">自动同步：关</button>
      </div>
      <div class="stat" id="syncStat"></div>
    </div>
    <div class="card">
      <h3>编号前缀</h3>
      <div class="frow">
        <div class="fcol"><input id="inPrefix" placeholder="APP"></div>
        <button id="btnPrefix" class="gray" style="flex:none">保存</button>
      </div>
      <div class="stat" id="prefixStat"></div>
    </div>
    <div class="card">
      <h3>数据管理</h3>
      <div class="statline" id="dataStat"></div>
      <button id="btnWipe" class="danger" style="width:100%;margin-top:10px">清空手机数据</button>
      <div class="hint">只清手机上的库存和出售记录；已同步到电脑的数据不受影响。操作前请先同步。</div>
    </div>
  </div>
</main>

<!-- 编辑商品 -->
<div id="mask" class="hide">
  <div id="sheet">
    <h3><span id="shTitle">修改商品</span><button class="gray small" id="shClose">关闭</button></h3>
    <div id="shBody"></div>
  </div>
</div>

<div id="toast" class="hide"></div>

<script>
'use strict';
var $ = function (id) { return document.getElementById(id); };
var LS = window.localStorage;
var base = '';                        // 电脑地址（共享用）
var titles = {};                      // 电脑端列题
var curItem = null;                   // 正在编辑的本地记录
var invView = 'loc';                  // loc=手机库存 pc=电脑库存

/* ================= 本地数据库 ================= */
function blankDB() {
  return { items: [], sales: [], seq: 1, prefix: 'APP',
           share: { base: '', code: '', token: '', auto: 0, last: '' } };
}
var DB = blankDB();
function loadDB() {
  try {
    var raw = LS.getItem('cgm_db');
    if (raw) DB = JSON.parse(raw);
  } catch (e) { DB = blankDB(); }
  if (!DB.share) DB.share = blankDB().share;
}
function saveDB() { LS.setItem('cgm_db', JSON.stringify(DB)); }
function itemByLid(lid) {
  for (var i = 0; i < DB.items.length; i += 1)
    if (DB.items[i].lid === lid) return DB.items[i];
  return null;
}
function nextCode() {
  var p = (DB.prefix || 'APP').replace(/[^0-9A-Za-z\u4e00-\u9fa5-]/g, '') || 'APP';
  var c = p + '-' + ('00000' + DB.seq).slice(-5);
  DB.seq += 1;
  return c;
}
function pendingCount() {
  var n = 0;
  DB.items.forEach(function (it) { if (it.dirty) n += 1; });
  DB.sales.forEach(function (s) { if (s.dirty) n += 1; });
  return n;
}
function nowStr() {
  var d = new Date(), p2 = function (x) { return ('0' + x).slice(-2); };
  return d.getFullYear() + '-' + p2(d.getMonth() + 1) + '-' + p2(d.getDate()) +
         ' ' + p2(d.getHours()) + ':' + p2(d.getMinutes());
}
function toast(msg) {
  var t = $('toast'); t.textContent = msg; t.classList.remove('hide');
  clearTimeout(t._h); t._h = setTimeout(function () { t.classList.add('hide'); }, 2600);
}

/* ================= 确认弹层 ================= */
var confirmCb = null;
function askConfirm(msg, okText, cb) {
  $('shTitle').textContent = '请确认';
  var b = $('shBody');
  b.innerHTML = '';
  var p = document.createElement('div');
  p.style.cssText = 'font-size:14px;line-height:1.7;color:#44506a';
  p.textContent = msg;
  b.appendChild(p);
  var row = document.createElement('div'); row.className = 'btnrow';
  var no = document.createElement('button'); no.className = 'gray'; no.textContent = '取消';
  var yes = document.createElement('button'); yes.className = 'danger'; yes.textContent = okText || '确定';
  no.onclick = function () { $('mask').classList.add('hide'); confirmCb = null; };
  yes.onclick = function () { $('mask').classList.add('hide'); if (confirmCb) confirmCb(); confirmCb = null; };
  confirmCb = cb;
  row.appendChild(no); row.appendChild(yes); b.appendChild(row);
  $('mask').classList.remove('hide');
}

/* ================= 电脑接口（XHR + X-MToken） ================= */
function api(method, path, body) {
  return new Promise(function (resolve, reject) {
    var x = new XMLHttpRequest();
    x.open(method, base + path, true);
    x.setRequestHeader('X-MToken', DB.share.token || '');
    x.onreadystatechange = function () {
      if (x.readyState !== 4) return;
      var j = {};
      try { j = JSON.parse(x.responseText); } catch (e2) {}
      if (x.status === 401 && j.need_login) { dropShare('连接已失效，请重新连接电脑'); reject(new Error('need_login')); return; }
      if (x.status === 0) { reject(new Error('连不上电脑（检查共享是否开启、同一 WiFi）')); return; }
      if (x.status >= 400 || j.ok === false) { reject(new Error(j.error || ('请求失败 ' + x.status))); return; }
      resolve(j);
    };
    if (body === undefined) x.send();
    else { x.setRequestHeader('Content-Type', 'application/json'); x.send(JSON.stringify(body)); }
  });
}
function dropShare(msg) {
  DB.share.token = '';
  saveDB(); refreshHead();
  if (msg) toast(msg);
}
function normBase(v) {
  v = (v || '').trim();
  if (!v) return '';
  if (v.indexOf('http') !== 0) v = 'http://' + v;
  v = v.replace(/\/+$/, '');
  v = v.replace(/\/m(\/)?$/, '');
  return v;
}
function refreshHead() {
  var conn = !!DB.share.token;
  $('hPerm').textContent = conn ? '已连接电脑' : '本地模式';
  $('hPerm').className = 'badge' + (conn ? ' rw' : '');
}

/* 连接电脑（手填 / 扫二维码共用）：thenSync=true 时连上就把待同步数据推上去 */
function connectTo(b, code, thenSync) {
  b = normBase(b);
  code = (code || '').trim();
  if (!b) { toast('请填写电脑地址'); return; }
  if (!code) { toast('请填写连接码'); return; }
  base = b;
  $('btnShareConn').disabled = true;
  var x = new XMLHttpRequest();
  x.open('POST', b + '/m/login', true);
  x.setRequestHeader('Content-Type', 'application/json');
  x.onreadystatechange = function () {
    if (x.readyState !== 4) return;
    $('btnShareConn').disabled = false;
    var j = {};
    try { j = JSON.parse(x.responseText); } catch (e2) {}
    if (x.status === 0) { toast('连不上电脑（检查是否已开启共享、同一 WiFi）'); return; }
    if (!j.ok) { toast(j.error || '连接失败'); return; }
    DB.share.base = b; DB.share.code = code; DB.share.token = j.token || '';
    saveDB();
    if (!DB.share.token) { toast('电脑端版本过旧，请先升级电脑端'); return; }
    $('shBase').value = b;
    $('shCode').value = code;
    refreshHead(); renderShare(); renderSync();
    toast('已连接电脑');
    api('GET', '/m/api/whoami').then(function (w) {
      refreshHead(); renderShare(); renderSync();
      toast('已连接：' + (w.warehouse || '电脑端'));
      if (thenSync) {
        if (pendingCount()) { toast('正在同步手机数据…'); syncAll(true); }
        else { toast('已连接，没有待同步的数据'); }
      }
    }).catch(function () { refreshHead(); renderShare(); renderSync(); });
  };
  x.send(JSON.stringify({ code: code, app: 1 }));
}
$('btnShareConn').onclick = function () {
  connectTo($('shBase').value, $('shCode').value, false);
};

/* 扫电脑二维码：按钮 → 原生扫码 → __qrResult 回填并自动连接 + 同步一次 */
$('btnQrConn').onclick = function () {
  if (!window.AndroidOcr || !window.AndroidOcr.scanQr) {
    toast('扫码需要新版 App，请先安装最新版');
    return;
  }
  window.AndroidOcr.scanQr();
};
window.__qrResult = function (text) {
  var info = parseQr(text);
  if (!info) { toast('这不是仓管家的连接二维码'); return; }
  if (!info.code) { toast('二维码里没有连接码，请扫电脑端「手机访问」里的二维码'); return; }
  $('shBase').value = info.base;
  $('shCode').value = info.code;
  toast('识别成功，正在连接…');
  connectTo(info.base, info.code, true);
};
/* 二维码内容（电脑端生成）：http://192.168.1.5:8765/m#c=123456
   兼容 ?c= / ?code= / &code= 几种写法（不用正则：页面里不能出现反斜杠） */
function parseQr(text) {
  if (!text) return null;
  var s = String(text).trim();
  var at = s.indexOf('http://');
  if (at < 0) at = s.indexOf('https://');
  if (at < 0) return null;
  var rest = s.slice(at);
  var cut = rest.length;
  var h = rest.indexOf('#');
  var q = rest.indexOf('?');
  if (h >= 0 && h < cut) cut = h;
  if (q >= 0 && q < cut) cut = q;
  var base = normBase(rest.slice(0, cut));
  if (!base) return null;
  var tail = rest.slice(cut);
  var code = '';
  var names = ['c=', 'code='];
  for (var i = 0; i < names.length && !code; i++) {
    var p = tail.indexOf(names[i]);
    if (p < 0) continue;
    var v = tail.slice(p + names[i].length);
    var keep = '';
    for (var j = 0; j < v.length; j++) {
      var ch = v.charAt(j);
      if ((ch >= '0' && ch <= '9') || (ch >= 'a' && ch <= 'z')
          || (ch >= 'A' && ch <= 'Z')) keep += ch;
      else break;
    }
    code = keep;
  }
  return { base: base, code: code };
}
$('btnShareOff').onclick = function () {
  if (DB.share.token) api('POST', '/m/logout').catch(function () {});
  DB.share.token = '';
  saveDB(); refreshHead(); renderShare(); renderSync();
  toast('已断开（手机数据不受影响）');
};

/* ================= 同步到电脑 =================
   手机数据同步进电脑端「手机数据」区（独立存放，不追加主库存）。
   /m/api/m_item 按手机本地 id 覆盖保存商品；/m/api/m_sale 保存出售记录（幂等）。
   只写独立的手机数据表、不碰主库存，所以登录后直接同步，不需要申请录入。 */
function pushItem(it) {
  return api('POST', '/m/api/m_item', {
    lid: it.lid, code: it.code || '',
    brand: it.brand || '', category: it.category || '', model: it.model || '',
    condition: it.condition || '', price: it.price || 0, qty: it.qty || 0,
    shelf: it.shelf || '', listed: it.listed === 0 ? 0 : 1,
    remark: it.remark || '', sold_out: it.sold_out ? 1 : 0
  }).then(function () { it.dirty = 0; saveDB(); });
}
function pushSale(s) {
  var it = itemByLid(s.lidRef);
  return api('POST', '/m/api/m_sale', {
    lid: s.lid, item_lid: s.lidRef || 0, code: (it && it.code) || s.code || '',
    brand: s.brand || (it && it.brand) || '', category: (it && it.category) || '',
    model: s.model || (it && it.model) || '',
    qty: s.qty, price: s.price, total: s.total || 0,
    buyer: s.buyer || '', sale_date: s.sale_date || nowStr(),
    out_type: s.out_type || '出售', remark: s.remark || ''
  }).then(function () { s.dirty = 0; saveDB(); });
}
function syncAll(manual) {
  if (!DB.share.token) { if (manual) toast('请先在设置里连接电脑'); return Promise.resolve(); }
  if (!pendingCount()) { if (manual) toast('没有待同步的数据'); renderSync(); return Promise.resolve(); }
  var p = Promise.resolve();
  DB.items.forEach(function (it) {
    if (it.dirty) p = p.then(function () { return pushItem(it); });
  });
  DB.sales.forEach(function (s) {
    if (s.dirty) p = p.then(function () { return pushSale(s); });
  });
  return p.then(function () {
    DB.share.last = nowStr();
    saveDB(); renderSync(); refreshHead();
    if (manual) toast('同步完成：待同步 0 条');
  }).catch(function (e) {
    renderSync();
    if (manual || String(e.message || e) !== 'need_login') toast(e.message || e);
  });
}
$('btnSync').onclick = function () { syncAll(true); };
$('btnAuto').onclick = function () {
  DB.share.auto = DB.share.auto ? 0 : 1;
  saveDB(); renderShare(); renderSync();
  toast(DB.share.auto ? '已开启自动同步（每次改动后自动上传）' : '已关闭自动同步');
};
function autoSync() {
  if (DB.share.auto && DB.share.token && pendingCount()) syncAll(false);
}
function renderShare() {
  $('shBase').value = DB.share.base || $('shBase').value;
  $('btnAuto').textContent = '自动同步：' + (DB.share.auto ? '开' : '关');
  $('btnAuto').className = DB.share.auto ? '' : 'gray';
  $('shareStat').innerHTML = '';
  var line = $('shareStat');
  line.textContent = DB.share.token
    ? '已连接：' + (DB.share.base || '') + '（数据直接同步到电脑「手机数据」）'
    : '未连接。连接后手机数据可同步到电脑。';
}
function renderSync() {
  var n = pendingCount();
  $('syncStat').textContent = '待同步 ' + n + ' 条' +
    (DB.share.last ? ' · 上次同步 ' + DB.share.last : '') +
    (n && !DB.share.token ? '（连接电脑后同步）' : '');
  $('btnSync').disabled = !DB.share.token || !n;
}

/* ================= 库存 ================= */
var LOC_COLS = ['code', 'brand', 'model', 'qty', 'price', 'shelf'];
var PC_COLS = ['code', 'brand', 'model', 'qty', 'price', 'shelf'];
$('btnKw').onclick = function () { invView === 'loc' ? loadLoc($('inKw').value) : loadPc($('inKw').value); };
$('inKw').addEventListener('keydown', function (e) {
  if (e.key === 'Enter') $('btnKw').click();
});
$('segLoc').onclick = function () { invView = 'loc'; $('segLoc').className = 'on'; $('segPc').className = ''; loadLoc($('inKw').value); };
$('segPc').onclick = function () {
  if (!DB.share.token) { toast('请先在设置里连接电脑'); return; }
  invView = 'pc'; $('segPc').className = 'on'; $('segLoc').className = '';
  loadPc($('inKw').value);
};
function mkHead(tbl, cols) {
  var thead = tbl.tHead; thead.innerHTML = '';
  var tr = document.createElement('tr');
  cols.forEach(function (f) {
    var th = document.createElement('th');
    th.textContent = titles[f] || CT_DEFS[f] || f;
    tr.appendChild(th);
  });
  thead.appendChild(tr);
}
function loadLoc(kw) {
  kw = (kw || '').toLowerCase();
  mkHead($('tInv'), LOC_COLS);
  var tb = $('tInv').tBodies[0]; tb.innerHTML = '';
  var rows = DB.items.filter(function (it) {
    if (!kw) return true;
    return LOC_COLS.concat(['category', 'remark']).some(function (f) {
      return String(it[f] || '').toLowerCase().indexOf(kw) >= 0;
    });
  });
  rows.sort(function (a, b) { return a.lid - b.lid; });
  $('invStat').textContent = '手机库存 ' + DB.items.length + ' 条（点行可修改；数据存在手机）';
  if (!rows.length) { tb.innerHTML = '<tr><td colspan="6" class="empty">还没有记录，去「录入」添加</td></tr>'; return; }
  rows.forEach(function (r) {
    var tr = document.createElement('tr');
    if (r.sold_out) tr.className = 'sold';
    LOC_COLS.forEach(function (f) {
      var td = document.createElement('td');
      td.textContent = (r[f] === null || r[f] === undefined) ? '' : r[f];
      tr.appendChild(td);
    });
    tr.onclick = function () { openEdit(r); };
    tb.appendChild(tr);
  });
}
function loadPc(kw) {
  mkHead($('tInv'), PC_COLS);
  var tb = $('tInv').tBodies[0];
  tb.innerHTML = '<tr><td colspan="6" class="empty">读取电脑库存…</td></tr>';
  api('GET', '/m/api/items?kw=' + encodeURIComponent(kw || '')).then(function (j) {
    tb.innerHTML = '';
    $('invStat').textContent = '电脑库存 ' + j.total + ' 条（只读；修改请在电脑端或手机录入后同步）';
    if (!(j.items || []).length) { tb.innerHTML = '<tr><td colspan="6" class="empty">没有找到记录</td></tr>'; return; }
    j.items.forEach(function (r) {
      var tr = document.createElement('tr');
      if (r.sold_out) tr.className = 'sold';
      PC_COLS.forEach(function (f) {
        var td = document.createElement('td');
        td.textContent = (r[f] === null || r[f] === undefined) ? '' : r[f];
        tr.appendChild(td);
      });
      tb.appendChild(tr);
    });
  }).catch(function (e) {
    tb.innerHTML = '<tr><td colspan="6" class="empty">' + (e.message || e) + '</td></tr>';
  });
}
/* 编辑本地商品 */
function openEdit(r) {
  curItem = r;
  ocrTarget = 'edit';
  $('shTitle').textContent = '修改 ' + r.code;
  var b = $('shBody'); b.innerHTML = '';
  function field(label, id, val, extra, scan) {
    var w = document.createElement('div'); w.className = 'fcol';
    var l = document.createElement('label');
    if (scan) {
      l.className = 'lbl-io';
      l.appendChild(document.createTextNode(label));
      var sb = document.createElement('button');
      sb.type = 'button'; sb.className = 'gray small'; sb.textContent = '扫一扫';
      sb.onclick = function () { startScan('edit'); };
      l.appendChild(sb);
    } else {
      l.textContent = label;
    }
    var inp = document.createElement('input'); inp.id = id; inp.value = val || '';
    if (extra) inp.setAttribute('inputmode', extra);
    w.appendChild(l); w.appendChild(inp);
    return w;
  }
  function two(a, c) {
    var w = document.createElement('div'); w.className = 'frow';
    w.appendChild(a); w.appendChild(c); b.appendChild(w);
  }
  var fBrand = field('品牌', 'eBrand', r.brand);
  var fCate = field('品类', 'eCate', r.category);
  var fModel = field('型号', 'eModel', r.model, null, true);
  var fCond = field('成色', 'eCond', r.condition);
  var fPrice = field('单价', 'ePrice', r.price, 'decimal');
  var fQty = field('数量', 'eQty', r.qty, 'numeric');
  var fShelf = field('货架', 'eShelf', r.shelf);
  two(fBrand, fCate); two(fModel, fCond); two(fPrice, fQty);
  b.appendChild(fShelf);
  var rowBtn = document.createElement('div'); rowBtn.className = 'btnrow';
  var bDel = document.createElement('button'); bDel.className = 'danger'; bDel.textContent = '删除';
  var bSave = document.createElement('button'); bSave.textContent = '保存';
  rowBtn.appendChild(bDel); rowBtn.appendChild(bSave); b.appendChild(rowBtn);
  bSave.onclick = function () {
    r.brand = document.getElementById('eBrand').value;
    r.category = document.getElementById('eCate').value;
    r.model = document.getElementById('eModel').value;
    r.condition = document.getElementById('eCond').value;
    r.price = parseFloat(document.getElementById('ePrice').value) || 0;
    r.qty = parseInt(document.getElementById('eQty').value, 10) || 0;
    r.shelf = document.getElementById('eShelf').value;
    r.sold_out = r.qty <= 0 ? 1 : 0; r.dirty = 1;
    saveDB(); $('mask').classList.add('hide');
    toast('已保存到手机' + (DB.share.auto ? '，正在同步…' : ''));
    loadLoc($('inKw').value); renderSync(); renderData(); autoSync();
  };
  bDel.onclick = function () {
    $('mask').classList.add('hide');
    askConfirm('删除手机上的 ' + r.code + ' ？\n已同步到电脑的记录不会被删除。', '删除', function () {
      DB.items = DB.items.filter(function (x) { return x.lid !== r.lid; });
      saveDB(); loadLoc($('inKw').value); renderSync(); renderData();
      toast('已删除（本地）');
    });
  };
  $('mask').classList.remove('hide');
}
$('shClose').onclick = function () { $('mask').classList.add('hide'); };

/* ================= 扫一扫识别型号 =================
   相机实时取景，本机离线 OCR（模型随 App 打包），识别到的文字点一下就填进型号框。
   完全在手机上跑，不需要电脑、不需要网络。 */
var ocrTarget = 'add';
function startScan(target) {
  ocrTarget = target || 'add';
  var b = window.AndroidOcr;
  if (!b || typeof b.scan !== 'function') {
    toast('扫一扫需要仓管家手机 App（用手机浏览器打开时不可用）');
    return;
  }
  try {
    b.scan();
  } catch (e) {
    toast('打不开扫一扫：' + (e.message || e));
  }
}
window.__ocrFill = function (text) {
  if (!text) return;
  var box = null;
  if (ocrTarget === 'edit') box = $('eModel');
  if (!box) box = $('aModel');
  if (!box) { toast('识别结果：' + text); return; }
  box.value = text;
  try { box.focus(); } catch (e) {}
  toast('已填入型号：' + text);
};
$('btnScanModel').onclick = function () { startScan('add'); };

/* ================= 录入 ================= */
$('btnAdd').onclick = function () {
  var it = {
    lid: Date.now(),
    code: nextCode(),
    brand: $('aBrand').value.trim(), category: $('aCate').value.trim(),
    model: $('aModel').value.trim(), condition: $('aCond').value.trim(),
    price: parseFloat($('aPrice').value) || 0,
    qty: parseInt($('aQty').value, 10) || 1,
    shelf: $('aShelf').value.trim(), listed: 1,
    remark: $('aRemark').value.trim(), sold_out: 0, dirty: 1
  };
  if (!it.brand && !it.category && !it.model) { toast('品牌 / 品类 / 型号 至少填一项'); return; }
  DB.items.push(it);
  saveDB();
  toast('已入库：' + it.code + (DB.share.auto ? '，正在同步…' : '（待同步）'));
  $('aModel').value = ''; $('aRemark').value = '';
  renderSync(); renderData(); autoSync();
};

/* ================= 出售 ================= */
$('btnSell').onclick = function () {
  var code = $('sCode').value.trim();
  var it = null;
  DB.items.forEach(function (x) { if (x.code.toLowerCase() === code.toLowerCase()) it = x; });
  if (!it) { toast('没有找到编号 ' + (code || '（请填写）')); return; }
  if (it.sold_out || it.qty <= 0) { toast(it.code + ' 已售完'); return; }
  var qty = parseInt($('sQty').value, 10) || 1;
  if (qty > it.qty) { toast('库存只有 ' + it.qty + ' 个'); return; }
  var price = $('sPrice').value === '' ? it.price : (parseFloat($('sPrice').value) || 0);
  var s = {
    lid: Date.now(), lidRef: it.lid, code: it.code,
    brand: it.brand, model: it.model, qty: qty, price: price,
    total: Math.round(qty * price * 100) / 100,
    buyer: $('sBuyer').value.trim(), sale_date: nowStr(),
    out_type: '出售', remark: $('sRemark').value.trim(), dirty: 1
  };
  DB.sales.push(s);
  it.qty -= qty;
  if (it.qty <= 0) { it.qty = 0; it.sold_out = 1; }
  it.dirty = 1;
  saveDB();
  $('sellMsg').textContent = '已售出 ' + it.code + ' × ' + qty + '，合计 ¥' + s.total +
    '，剩余 ' + it.qty;
  toast('已登记出售' + (DB.share.auto ? '，正在同步…' : '（待同步）'));
  $('sCode').value = '';
  renderSync(); renderData(); autoSync();
};

/* ================= 记录 ================= */
var REC_COLS = ['sale_date', 'code', 'brand', 'model', 'qty', 'total', 'buyer'];
function loadRec() {
  var tb = $('tRec').tBodies[0]; tb.innerHTML = '';
  mkHead($('tRec'), REC_COLS);
  if (!DB.sales.length) { tb.innerHTML = '<tr><td colspan="7" class="empty">暂无出售记录</td></tr>'; return; }
  var rows = DB.sales.slice().reverse();
  rows.forEach(function (s) {
    var tr = document.createElement('tr');
    REC_COLS.forEach(function (f) {
      var td = document.createElement('td');
      td.textContent = (s[f] === null || s[f] === undefined) ? '' : s[f];
      tr.appendChild(td);
    });
    var tdS = document.createElement('td');
    var tag = document.createElement('span');
    tag.className = 'tag ' + (s.dirty ? 'wait' : 'ok');
    tag.textContent = s.dirty ? '待同步' : '已同步';
    tdS.appendChild(tag);
    tr.appendChild(tdS);
    tb.appendChild(tr);
  });
}

/* ================= 设置 ================= */
$('btnPrefix').onclick = function () {
  var v = $('inPrefix').value.trim().replace(/[^0-9A-Za-z\u4e00-\u9fa5-]/g, '');
  DB.prefix = v || 'APP';
  saveDB();
  $('prefixStat').textContent = '新编号将形如 ' + DB.prefix + '-00001（已生成的不变）';
  toast('前缀已保存：' + DB.prefix);
};
$('btnWipe').onclick = function () {
  askConfirm('确定清空手机上的全部库存和出售记录？\n已同步到电脑的数据不受影响，但未同步的会丢失。', '全部清空', function () {
    var keep = { seq: DB.seq, prefix: DB.prefix, share: DB.share };
    DB = blankDB(); DB.seq = keep.seq; DB.prefix = keep.prefix; DB.share = keep.share;
    saveDB();
    loadLoc(''); loadRec(); renderSync(); renderData();
    toast('已清空手机数据');
  });
};
function renderData() {
  $('dataStat').textContent = '手机库存 ' + DB.items.length + ' 条 · 出售记录 ' +
    DB.sales.length + ' 条 · 待同步 ' + pendingCount() + ' 条';
}

/* ================= 页签 ================= */
function tab2(name) {
  var tabs = document.querySelectorAll('nav div');
  for (var i = 0; i < tabs.length; i += 1)
    tabs[i].className = (tabs[i].getAttribute('data-t') === name) ? 'on' : '';
  var map = { inv: 'Inv', add: 'Add', sell: 'Sell', rec: 'Rec', set: 'Set' };
  ['Inv', 'Add', 'Sell', 'Rec', 'Set'].forEach(function (p) { $('p' + p).classList.add('hide'); });
  $('p' + map[name]).classList.remove('hide');
  if (name === 'inv') (invView === 'loc' ? loadLoc : loadPc)($('inKw').value);
  if (name === 'rec') loadRec();
  if (name === 'set') { renderShare(); renderSync(); renderData(); }
}
(function () {
  var tabs = document.querySelectorAll('nav div');
  for (var i = 0; i < tabs.length; i += 1)
    tabs[i].onclick = function () { tab2(this.getAttribute('data-t')); };
})();

/* ================= 列题（电脑端共享设置，用于电脑库存表头） ================= */
var CT_DEFS = { code: '编号', brand: '品牌', category: '品类', model: '型号',
                condition: '成色', price: '单价', qty: '数量', shelf: '货架',
                listed: '上架', remark: '备注', total: '合计', sale_date: '日期' };
function loadTitles() {
  if (!DB.share.token) { titles = {}; return Promise.resolve(); }
  return api('GET', '/m/api/coltitles').then(function (j) {
    titles = j.titles || {};
  }).catch(function () { titles = {}; });
}

/* ================= 启动 ================= */
loadDB();
$('inPrefix').value = DB.prefix || 'APP';
refreshHead();
renderSync(); renderData();
(function () {
  var m = (location.hash || '').match(/base=([^&]+)/);
  if (m) {
    try {
      var b = decodeURIComponent(m[1]);
      if (b && !DB.share.base) { DB.share.base = b; saveDB(); }
    } catch (e2) {}
  }
  base = DB.share.base || '';
  $('shBase').value = base;
  if (base && DB.share.token) {
    api('GET', '/m/api/whoami').then(function (w) {
      refreshHead(); renderShare();
      loadTitles().then(function () { if (invView === 'pc') loadPc($('inKw').value); });
      autoSync();          /* 已连接电脑：开机就把待同步的数据送上去 */
    }).catch(function () {});
  } else {
    renderShare();
  }
  loadLoc(''); loadRec();
})();
</script>
</body>
