<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>仓管家</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
body { font-family:-apple-system,"Microsoft YaHei",sans-serif; background:#f4f6fa; color:#1c2333;
       font-size:15px; height:100vh; display:flex; flex-direction:column; overflow:hidden; }
.hide { display:none !important; }
input,select,textarea,button { font-family:inherit; font-size:15px; }
input,select,textarea { border:1px solid #d7dde8; border-radius:8px; padding:9px 10px; background:#fff; width:100%; }
button { border:0; border-radius:8px; padding:11px 14px; background:#1f6feb; color:#fff; font-weight:600; }
button.gray { background:#eef1f6; color:#44506a; }
button.danger { background:#e5484d; }
button:disabled { opacity:.5; }
/* ---- 登录 ---- */
#vLogin { flex:1; display:flex; flex-direction:column; justify-content:center; padding:34px 26px; }
#vLogin .logo { font-size:46px; text-align:center; }
#vLogin h1 { font-size:21px; text-align:center; margin:8px 0 20px; }
#vLogin .tip { color:#8a94a6; font-size:13px; text-align:center; margin-bottom:18px; line-height:1.6; }
#vLogin label { font-size:13px; color:#5a6478; margin:10px 0 5px; }
#vLogin input { margin-bottom:4px; }
#vLogin .err { color:#e5484d; font-size:13px; min-height:18px; margin:6px 0; }
/* ---- 主界面 ---- */
header { background:#1f6feb; color:#fff; padding:10px 14px; display:flex; align-items:center; gap:8px; flex:none; }
header b { font-size:16px; flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
header .badge { font-size:11px; background:rgba(255,255,255,.22); border-radius:10px; padding:3px 8px; flex:none; }
header .badge.rw { background:#2fb344; }
header button { padding:6px 10px; font-size:12px; background:rgba(255,255,255,.18); flex:none; }
nav { display:flex; background:#fff; border-bottom:1px solid #e2e7f0; flex:none; }
nav div { flex:1; text-align:center; padding:10px 0; color:#5a6478; font-size:14px; border-bottom:2px solid transparent; }
nav div.on { color:#1f6feb; border-bottom-color:#1f6feb; font-weight:700; }
main { flex:1; overflow:auto; padding:12px; }
.card { background:#fff; border:1px solid #e2e7f0; border-radius:12px; padding:14px; margin-bottom:12px; }
.card h3 { font-size:15px; margin-bottom:10px; }
.card .hint { color:#8a94a6; font-size:12px; margin-top:8px; line-height:1.6; }
.frow { display:flex; gap:10px; }
.fcol { flex:1; margin-bottom:10px; }
.fcol label { display:block; font-size:12px; color:#5a6478; margin-bottom:4px; }
/* ---- 表格 ---- */
.tblwrap { overflow:auto; background:#fff; border:1px solid #e2e7f0; border-radius:12px; }
table { border-collapse:collapse; min-width:100%; }
th { background:#eef1f6; color:#44506a; font-size:12px; font-weight:600; padding:9px 10px;
     white-space:nowrap; position:sticky; top:0; text-align:left; border-bottom:1px solid #d7dde8; }
th.edit { color:#1f6feb; }
td { padding:9px 10px; border-bottom:1px solid #eef1f6; font-size:13px; white-space:nowrap; }
tr.sold td { color:#b3b9c6; }
tr:active { background:#f0f5ff; }
.empty { text-align:center; color:#8a94a6; padding:30px 0; font-size:13px; }
.searchrow { display:flex; gap:8px; margin-bottom:10px; }
.searchrow input { flex:1; }
.searchrow button { flex:none; }
/* ---- 弹层 ---- */
#mask { position:fixed; inset:0; background:rgba(20,26,40,.45); z-index:20;
        display:flex; align-items:flex-end; justify-content:center; }
#sheet { background:#fff; border-radius:16px 16px 0 0; width:100%; max-height:88vh;
         overflow:auto; padding:16px 16px 26px; }
#sheet h3 { margin-bottom:12px; display:flex; align-items:center; }
#sheet h3 span { flex:1; }
#toast { position:fixed; left:50%; bottom:90px; transform:translateX(-50%);
         background:rgba(20,26,40,.85); color:#fff; padding:9px 16px; border-radius:20px;
         font-size:13px; z-index:30; max-width:80vw; text-align:center; }
#errBox { background:#fdecec; color:#c03538; border:1px solid #f5c2c4; border-radius:8px;
          padding:9px 11px; font-size:13px; margin-bottom:10px; line-height:1.5; }
/* ---- 列题设置 ---- */
.ctrow { display:flex; align-items:center; gap:10px; padding:7px 0; border-bottom:1px solid #f0f2f7; }
.ctrow .def { flex:none; width:64px; font-size:13px; color:#8a94a6; }
.ctrow input { flex:1; padding:7px 9px; }
.ctrow input.custom { border-color:#1f6feb; }
.stat { color:#8a94a6; font-size:12px; margin:6px 2px 0; }
</style>
</head>
<body>

<!-- 登录 -->
<div id="vLogin">
  <div class="logo">&#128230;</div>
  <h1>仓管家 · 手机端</h1>
  <div class="tip">界面装在手机里，数据实时来自电脑。<br>电脑和手机需连同一个 WiFi，电脑端已「开启共享」。</div>
  <label>电脑地址（局域网共享 → 手机访问）</label>
  <input id="inBase" placeholder="例如 192.168.1.5:8765" autocapitalize="off" autocomplete="off">
  <label>连接码</label>
  <input id="inCode" type="password" inputmode="numeric" placeholder="电脑上显示的 6 位连接码">
  <div class="err" id="loginErr"></div>
  <button id="btnLogin" style="width:100%">进 入</button>
</div>

<!-- 主界面 -->
<div id="vMain" class="hide" style="flex:1;display:flex;flex-direction:column;overflow:hidden;">
  <header>
    <b id="hWh">仓管家</b>
    <span class="badge" id="hPerm">只读</span>
    <button id="btnReq">申请录入</button>
    <button id="btnOut">退出</button>
  </header>
  <nav>
    <div data-t="inv" class="on">库存</div>
    <div data-t="add">录入</div>
    <div data-t="sell">出售</div>
    <div data-t="rec">记录</div>
    <div data-t="set">设置</div>
  </nav>
  <main id="main">
    <!-- 库存 -->
    <div id="pInv">
      <div class="searchrow"><input id="inKw" placeholder="搜编号 / 品牌 / 型号 / 货架 / 备注">
        <button id="btnKw">搜索</button></div>
      <div class="stat" id="invStat"></div>
      <div class="tblwrap"><table id="tInv"><thead></thead><tbody></tbody></table></div>
    </div>
    <!-- 录入 -->
    <div id="pAdd" class="hide">
      <div class="card">
        <h3>新增入库（编号自动生成）</h3>
        <div class="frow">
          <div class="fcol"><label>品牌</label><input id="aBrand"></div>
          <div class="fcol"><label>品类</label><input id="aCate"></div>
        </div>
        <div class="frow">
          <div class="fcol"><label>型号</label><input id="aModel"></div>
          <div class="fcol"><label>成色</label><input id="aCond"></div>
        </div>
        <div class="frow">
          <div class="fcol"><label>单价</label><input id="aPrice" inputmode="decimal"></div>
          <div class="fcol"><label>数量</label><input id="aQty" inputmode="numeric" value="1"></div>
        </div>
        <div class="fcol"><label>货架</label><input id="aShelf"></div>
        <div class="fcol"><label>备注</label><textarea id="aRemark" rows="2"></textarea></div>
        <div id="errAdd" style="display:none"></div>
        <button id="btnAdd" style="width:100%">保存到电脑</button>
        <div class="hint">保存后电脑端几秒内可见；未授权时先点右上角「申请录入」。</div>
      </div>
    </div>
    <!-- 出售 -->
    <div id="pSell" class="hide">
      <div class="card">
        <h3>登记出售</h3>
        <div class="fcol"><label>商品编号</label><input id="sCode" autocapitalize="characters"></div>
        <div class="frow">
          <div class="fcol"><label>数量</label><input id="sQty" inputmode="numeric" value="1"></div>
          <div class="fcol"><label>单价（留空按原价）</label><input id="sPrice" inputmode="decimal"></div>
        </div>
        <div class="frow">
          <div class="fcol"><label>买家</label><input id="sBuyer"></div>
          <div class="fcol"><label>备注</label><input id="sRemark"></div>
        </div>
        <button id="btnSell" style="width:100%">登记出售</button>
        <div class="hint" id="sellMsg"></div>
      </div>
    </div>
    <!-- 记录 -->
    <div id="pRec" class="hide">
      <div class="searchrow"><input id="inSkw" placeholder="搜编号 / 买家">
        <button id="btnSkw">搜索</button></div>
      <div class="tblwrap"><table id="tRec"><thead></thead><tbody></tbody></table></div>
    </div>
    <!-- 设置 -->
    <div id="pSet" class="hide">
      <div class="card">
        <h3>表格列题自定义</h3>
        <div class="hint" style="margin:0 0 10px">改列标题（如把「品牌」改成「名称」），保存后手机和电脑端表格同步生效。留空 = 恢复默认。</div>
        <div id="ctList"></div>
        <div style="display:flex;gap:10px;margin-top:12px">
          <button id="btnCtSave" style="flex:1">保存到电脑</button>
          <button id="btnCtReset" class="gray" style="flex:1">全部恢复默认</button>
        </div>
        <div class="stat" id="ctStat"></div>
      </div>
      <div class="card">
        <h3>连接</h3>
        <div class="stat" id="setBase" style="font-size:13px;color:#44506a"></div>
        <div style="display:flex;gap:10px;margin-top:10px">
          <button id="btnReconn" class="gray" style="flex:1">重新登录</button>
          <button id="btnChange" class="gray" style="flex:1">更换电脑地址</button>
        </div>
      </div>
    </div>
  </main>
</div>

<!-- 编辑商品弹层 -->
<div id="mask" class="hide">
  <div id="sheet">
    <h3><span id="shTitle">修改商品</span><button class="gray" id="shClose" style="padding:6px 12px">关闭</button></h3>
    <div class="frow">
      <div class="fcol"><label>品牌</label><input id="eBrand"></div>
      <div class="fcol"><label>品类</label><input id="eCate"></div>
    </div>
    <div class="frow">
      <div class="fcol"><label>型号</label><input id="eModel"></div>
      <div class="fcol"><label>成色</label><input id="eCond"></div>
    </div>
    <div class="frow">
      <div class="fcol"><label>单价</label><input id="ePrice" inputmode="decimal"></div>
      <div class="fcol"><label>数量</label><input id="eQty" inputmode="numeric"></div>
    </div>
    <div class="frow">
      <div class="fcol"><label>货架</label><input id="eShelf"></div>
      <div class="fcol"><label>上架</label><select id="eListed"><option value="1">上架</option><option value="0">下架</option></select></div>
    </div>
    <div class="fcol"><label>备注</label><textarea id="eRemark" rows="2"></textarea></div>
    <button id="btnESave" style="width:100%;margin-top:6px">保存到电脑</button>
  </div>
</div>

<div id="toast" class="hide"></div>

<script>
'use strict';
var $ = function (id) { return document.getElementById(id); };
var LS = window.localStorage;
var base = '', token = '', titles = {}, curItem = null, editField = '';

function toast(msg) {
  var t = $('toast'); t.textContent = msg; t.classList.remove('hide');
  clearTimeout(t._h); t._h = setTimeout(function () { t.classList.add('hide'); }, 2600);
}
function showErr(id, msg) {
  var el = $(id);
  if (!msg) { el.style.display = 'none'; return; }
  el.style.display = 'block';
  el.className = 'errBoxWrap';
  el.style.cssText = 'display:block;background:#fdecec;color:#c03538;border:1px solid #f5c2c4;border-radius:8px;padding:9px 11px;font-size:13px;margin-bottom:10px;line-height:1.5';
  el.textContent = msg;
}
/* ---------------- API（XHR：本地 file:// 页面向电脑跨源请求最稳的方式） ---------------- */
function api(method, path, body) {
  return new Promise(function (resolve, reject) {
    var x = new XMLHttpRequest();
    x.open(method, base + path, true);
    x.setRequestHeader('X-MToken', token);
    x.onreadystatechange = function () {
      if (x.readyState !== 4) return;
      var j = {};
      try { j = JSON.parse(x.responseText); } catch (e2) {}
      if (x.status === 401 && j.need_login) { logoutLocal(); reject(new Error('登录已过期，请重新登录')); return; }
      if (x.status === 0) { reject(new Error('连不上电脑（检查共享是否开启、同一 WiFi）')); return; }
      if (x.status >= 400 || j.ok === false) { reject(new Error(j.error || ('请求失败 ' + x.status))); return; }
      resolve(j);
    };
    if (body === undefined) x.send();
    else { x.setRequestHeader('Content-Type', 'application/json'); x.send(JSON.stringify(body)); }
  });
}
/* ---------------- 登录 ---------------- */
function normBase(v) {
  v = (v || '').trim();
  if (!v) return '';
  if (v.indexOf('http') !== 0) v = 'http://' + v;
  v = v.replace(/\/+$/, '');
  v = v.replace(/\/m(\/)?$/, '');
  return v;
}
function logoutLocal() {
  token = ''; LS.removeItem('cgm_token');
  $('vMain').classList.add('hide');
  $('vLogin').classList.remove('hide');
}
$('btnLogin').onclick = function () {
  var b = normBase($('inBase').value), code = $('inCode').value.trim();
  $('loginErr').textContent = '';
  if (!b) { $('loginErr').textContent = '请填写电脑地址'; return; }
  if (!code) { $('loginErr').textContent = '请填写连接码'; return; }
  base = b; LS.setItem('cgm_base', b);
  $('btnLogin').disabled = true;
  var x = new XMLHttpRequest();
  x.open('POST', b + '/m/login', true);
  x.setRequestHeader('Content-Type', 'application/json');
  x.onreadystatechange = function () {
    if (x.readyState !== 4) return;
    $('btnLogin').disabled = false;
    var j = {};
    try { j = JSON.parse(x.responseText); } catch (e2) {}
    if (x.status === 0) { $('loginErr').textContent = '连不上电脑（检查是否已开启共享、同一 WiFi）'; return; }
    if (!j.ok) { $('loginErr').textContent = j.error || '登录失败'; return; }
    token = j.token || '';
    if (!token) { $('loginErr').textContent = '电脑端版本过旧，请先升级电脑端'; return; }
    LS.setItem('cgm_token', token);
    enterMain();
  };
  x.send(JSON.stringify({ code: code, app: 1 }));
};
$('inCode').addEventListener('keydown', function (e) { if (e.key === 'Enter') $('btnLogin').click(); });

/* ---------------- 主界面 ---------------- */
function enterMain() {
  $('vLogin').classList.add('hide');
  $('vMain').classList.remove('hide');
  loadTitles().then(loadWho).then(function () { tab('inv'); });
}
function loadWho() {
  return api('GET', '/m/api/whoami').then(function (j) {
    $('hWh').textContent = j.warehouse || '仓管家';
    var rw = !!j.can_write;
    $('hPerm').textContent = rw ? '可录入' : '只读';
    $('hPerm').className = 'badge' + (rw ? ' rw' : '');
    $('btnReq').style.display = rw ? 'none' : '';
  });
}
$('btnReq').onclick = function () {
  api('POST', '/m/api/request_write').then(function () {
    toast('已向电脑发送申请，请在电脑上确认弹窗');
    var n = 0;
    var h = setInterval(function () {
      n += 1;
      loadWho().then(function () {
        if ($('hPerm').textContent === '可录入') { toast('已授权，可以录入了'); clearInterval(h); }
      }).catch(function () { clearInterval(h); });
      if (n >= 20) clearInterval(h);
    }, 3000);
  }).catch(function (e) { toast(e.message || e); });
};
$('btnOut').onclick = function () {
  api('POST', '/m/logout').catch(function () {}).then(logoutLocal);
};
$('btnChange').onclick = function () {
  if (window.App && App.changeAddress) App.changeAddress();
  else logoutLocal();
};
$('btnReconn').onclick = logoutLocal;

/* 页签 */
var loadedTabs = {};
function tab(name) {
  var tabs = document.querySelectorAll('nav div');
  for (var i = 0; i < tabs.length; i += 1)
    tabs[i].className = (tabs[i].getAttribute('data-t') === name) ? 'on' : '';
  ['inv', 'add', 'sell', 'rec', 'set'].forEach(function (p) {
    $('p' + p.charAt(0).toUpperCase() + p.slice(1)).classList.add('hide');
  });
  var map = { inv: 'Inv', add: 'Add', sell: 'Sell', rec: 'Rec', set: 'Set' };
  $('p' + map[name]).classList.remove('hide');
  if (name === 'inv') loadItems($('inKw').value);
  if (name === 'rec') loadSales($('inSkw').value);
  if (name === 'set') renderCt();
  if (name === 'sell' || name === 'add') loadWho();
}
(function () {
  var tabs = document.querySelectorAll('nav div');
  for (var i = 0; i < tabs.length; i += 1)
    tabs[i].onclick = function () { tab(this.getAttribute('data-t')); };
})();

/* ---------------- 库存 ---------------- */
var INV_COLS = ['code', 'brand', 'model', 'qty', 'price', 'shelf'];
$('btnKw').onclick = function () { loadItems($('inKw').value); };
$('inKw').addEventListener('keydown', function (e) { if (e.key === 'Enter') loadItems(this.value); });
function loadItems(kw) {
  return api('GET', '/m/api/items?kw=' + encodeURIComponent(kw || ''))
    .then(function (j) {
      var thead = $('tInv').tHead, tb = $('tInv').tBodies[0];
      var tr = document.createElement('tr');
      INV_COLS.forEach(function (f) {
        var th = document.createElement('th');
        th.textContent = titles[f] || f;
        th.className = 'edit';
        th.title = '点按修改列题';
        th.onclick = function () { gotoColTitle(f); };
        tr.appendChild(th);
      });
      thead.innerHTML = ''; thead.appendChild(tr);
      tb.innerHTML = '';
      $('invStat').textContent = '共 ' + j.total + ' 条（点行可修改）';
      if (!j.items.length) {
        tb.innerHTML = '<tr><td colspan="6" class="empty">没有找到记录</td></tr>';
        return;
      }
      j.items.forEach(function (r) {
        var row = document.createElement('tr');
        if (r.sold_out) row.className = 'sold';
        INV_COLS.forEach(function (f) {
          var td = document.createElement('td');
          td.textContent = (r[f] === null || r[f] === undefined) ? '' : r[f];
          row.appendChild(td);
        });
        row.onclick = function () { openEdit(r); };
        tb.appendChild(row);
      });
    })
    .catch(function (e) { toast(e.message || e); });
}
/* ---------------- 修改商品 ---------------- */
function openEdit(r) {
  curItem = r;
  $('shTitle').textContent = '修改 ' + (titles.code || '编号') + ' ' + r.code;
  $('eBrand').value = r.brand || ''; $('eCate').value = r.category || '';
  $('eModel').value = r.model || ''; $('eCond').value = r.condition || '';
  $('ePrice').value = r.price || ''; $('eQty').value = r.qty || 0;
  $('eShelf').value = r.shelf || ''; $('eListed').value = String(r.listed === 0 ? 0 : 1);
  $('eRemark').value = r.remark || '';
  $('mask').classList.remove('hide');
}
$('shClose').onclick = function () { $('mask').classList.add('hide'); };
$('btnESave').onclick = function () {
  if (!curItem) return;
  var body = {
    id: curItem.id,
    brand: $('eBrand').value, category: $('eCate').value, model: $('eModel').value,
    condition: $('eCond').value, price: parseFloat($('ePrice').value) || 0,
    qty: parseInt($('eQty').value, 10) || 0, shelf: $('eShelf').value,
    listed: $('eListed').value === '1' ? 1 : 0, remark: $('eRemark').value
  };
  $('btnESave').disabled = true;
  api('POST', '/m/api/update_all', body).then(function (j) {
    $('btnESave').disabled = false;
    $('mask').classList.add('hide');
    toast(j.message || '已保存');
    loadItems($('inKw').value);
  }).catch(function (e) {
    $('btnESave').disabled = false;
    toast(e.message || e);
  });
};
/* ---------------- 录入 ---------------- */
$('btnAdd').onclick = function () {
  var body = {
    brand: $('aBrand').value, category: $('aCate').value, model: $('aModel').value,
    condition: $('aCond').value, price: parseFloat($('aPrice').value) || 0,
    qty: parseInt($('aQty').value, 10) || 1, shelf: $('aShelf').value,
    listed: 1, remark: $('aRemark').value
  };
  if (!body.brand && !body.category && !body.model) { toast('品牌 / 品类 / 型号 至少填一项'); return; }
  $('btnAdd').disabled = true;
  api('POST', '/m/api/add', body).then(function (j) {
    $('btnAdd').disabled = false;
    toast('已入库，编号 ' + (j.code || ''));
    $('aModel').value = ''; $('aRemark').value = '';
  }).catch(function (e) { $('btnAdd').disabled = false; toast(e.message || e); });
};
/* ---------------- 出售 ---------------- */
$('btnSell').onclick = function () {
  var body = {
    code: $('sCode').value.trim(), qty: parseInt($('sQty').value, 10) || 1,
    price: $('sPrice').value === '' ? null : parseFloat($('sPrice').value),
    buyer: $('sBuyer').value, remark: $('sRemark').value
  };
  $('btnSell').disabled = true;
  api('POST', '/m/api/sell', body).then(function (j) {
    $('btnSell').disabled = false;
    $('sellMsg').textContent = j.message || '';
    toast(j.message || '已登记');
    $('sCode').value = '';
  }).catch(function (e) { $('btnSell').disabled = false; toast(e.message || e); });
};
/* ---------------- 记录 ---------------- */
var REC_COLS = ['sale_date', 'code', 'brand', 'model', 'qty', 'total', 'buyer'];
$('btnSkw').onclick = function () { loadSales($('inSkw').value); };
$('inSkw').addEventListener('keydown', function (e) { if (e.key === 'Enter') loadSales(this.value); });
function loadSales(kw) {
  api('GET', '/m/api/sales?kw=' + encodeURIComponent(kw || '')).then(function (j) {
    var thead = $('tRec').tHead, tb = $('tRec').tBodies[0];
    var tr = document.createElement('tr');
    REC_COLS.forEach(function (f) {
      var th = document.createElement('th');
      th.textContent = titles[f === 'total' ? 'total' : f] || (f === 'total' ? '合计' : f);
      tr.appendChild(th);
    });
    thead.innerHTML = ''; thead.appendChild(tr);
    tb.innerHTML = '';
    if (!j.sales.length) { tb.innerHTML = '<tr><td colspan="7" class="empty">暂无出售记录</td></tr>'; return; }
    j.sales.forEach(function (r) {
      var row = document.createElement('tr');
      REC_COLS.forEach(function (f) {
        var td = document.createElement('td');
        td.textContent = (r[f] === null || r[f] === undefined) ? '' : r[f];
        row.appendChild(td);
      });
      tb.appendChild(row);
    });
  }).catch(function (e) { toast(e.message || e); });
}
/* ---------------- 列题设置 ---------------- */
var CT_FIELDS = ['code', 'brand', 'category', 'model', 'condition', 'price',
                 'qty', 'shelf', 'listed', 'remark'];
var CT_DEFS = { code: '编号', brand: '品牌', category: '品类', model: '型号',
                condition: '成色', price: '单价', qty: '数量', shelf: '货架',
                listed: '上架', remark: '备注', total: '合计', sale_date: '日期' };
function loadTitles() {
  return api('GET', '/m/api/coltitles').then(function (j) {
    titles = j.titles || {};
  }).catch(function () { titles = {}; });
}
function renderCt() {
  $('setBase').textContent = '电脑地址：' + base;
  var box = $('ctList'); box.innerHTML = '';
  CT_FIELDS.forEach(function (f) {
    var row = document.createElement('div'); row.className = 'ctrow';
    var def = document.createElement('span'); def.className = 'def';
    def.textContent = CT_DEFS[f] || f;
    var inp = document.createElement('input');
    inp.value = titles[f] === (CT_DEFS[f] || f) ? '' : (titles[f] || '');
    inp.placeholder = '留空恢复默认';
    if (inp.value) inp.className = 'custom';
    inp.setAttribute('data-f', f);
    row.appendChild(def); row.appendChild(inp); box.appendChild(row);
  });
}
function gotoColTitle(field) { tab('set'); setTimeout(function () {
  var el = document.querySelector('#ctList input[data-f="' + field + '"]');
  if (el) { el.focus(); el.scrollIntoView({ block: 'center' }); }
}, 120); }
$('btnCtSave').onclick = function () {
  var body = { titles: {} };
  var inputs = document.querySelectorAll('#ctList input');
  for (var i = 0; i < inputs.length; i += 1)
    body.titles[inputs[i].getAttribute('data-f')] = inputs[i].value.trim();
  $('btnCtSave').disabled = true;
  api('POST', '/m/api/coltitles', body).then(function (j) {
    $('btnCtSave').disabled = false;
    titles = j.titles || {};
    $('ctStat').textContent = '已保存 · 电脑端表头同步生效';
    toast(j.message || '列题已保存');
    renderCt();
  }).catch(function (e) { $('btnCtSave').disabled = false; toast(e.message || e); });
};
$('btnCtReset').onclick = function () {
  var body = { titles: {} };
  var inputs = document.querySelectorAll('#ctList input');
  for (var i = 0; i < inputs.length; i += 1) { inputs[i].value = ''; inputs[i].className = ''; }
  $('btnCtSave').click();
};
/* ---------------- 启动 ---------------- */
(function () {
  var m = (location.hash || '').match(/base=([^&]+)/);
  if (m) {
    try { base = decodeURIComponent(m[1]); LS.setItem('cgm_base', base); } catch (e2) { base = ''; }
  }
  if (!base) base = LS.getItem('cgm_base') || '';
  token = LS.getItem('cgm_token') || '';
  $('inBase').value = base;
  if (base && token) {
    api('GET', '/m/api/whoami').then(enterMain).catch(function () { logoutLocal(); });
  }
})();
</script>
</body>
